icon: redirects-icon
label: redirects.app.label
appClass: info.magnolia.ui.framework.app.BaseApp
class: info.magnolia.ui.contentapp.configuration.ContentAppDescriptor

datasource: &datasource
  $type: jcrDatasource
  workspace: redirects
  allowedNodeTypes:
    - mgnl:redirect
    - mgnl:folder

subApps:
  browser:
    class: info.magnolia.ui.contentapp.configuration.BrowserDescriptor
    actions:
      addRedirect:
        icon: icon-add-item
        $type: openDetailSubappAction
        appName: redirects
        subAppName: detail
        viewType: add
        availability:
          writePermissionRequired: true
          root: true
      editRedirect:
        icon: icon-edit
        $type: openDetailSubappAction
        appName: redirects
        subAppName: detail
        viewType: edit
        availability:
          writePermissionRequired: true
          rules:
            notDeleted: &notDeleted
              $type: jcrIsDeletedRule
              negate: true
      deleteRedirect:
        icon: icon-delete
        $type: deleteNodesConfirmationAction
        successActionName: markDeleted
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            notDeleted: *notDeleted
      markDeleted:
        $type: markAsDeletedAction
        command: markAsDeleted
        datasourceRefreshBehavior: items
        availability:
          writePermissionRequired: true
          rules:
            notDeleted: *notDeleted
      publish:
        icon: icon-publish
        $type: jcrCommandAction
        catalog: versioned
        command: publish
        datasourceRefreshBehavior: items
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            notDeleted: *notDeleted
            isPublishable:
              $type: jcrPublishableRule
      unpublish:
        icon: icon-unpublish
        $type: jcrCommandAction
        command: unpublish
        datasourceRefreshBehavior: items
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            notDeleted: *notDeleted
            isPublished:
              $type: jcrPublishedRule
      deletePermanently:
        icon: icon-delete
        $type: confirmationAlertAction
        successActionName: publishDeletion
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            isDeleted: &isDeleted
              $type: jcrIsDeletedRule
      publishDeletion:
        icon: icon-delete
        $type: jcrCommandAction
        catalog: versioned
        command: publish
        datasourceRefreshBehavior: items
        availability:
          multiple: true
          writePermissionRequired: true
          rules:
            isDeleted: *isDeleted
      restore:
        icon: icon-rotate-image-ccw
        $type: restorePreviousJcrVersionAction
        datasourceRefreshBehavior: items
        availability:
          writePermissionRequired: true
          rules:
            isDeleted: *isDeleted
            hasVersions:
              $type: jcrHasVersionsRule
      addFolder:
        icon: icon-add-folder
        $type: addNodeAction
        nodeType: mgnl:folder
        availability:
          writePermissionRequired: true
    actionbar:
      defaultAction: editRedirect
      sections:
        # First matching section wins. Deleted items must precede normal items.
        - name: deletedRedirect
          availability:
            multiple: true
            nodeTypes:
              - mgnl:redirect
              - mgnl:folder
            rules:
              isDeleted: *isDeleted
          groups:
            - name: publishingActions
              items:
                - name: deletePermanently
                - name: restore
        - name: redirect
          availability:
            multiple: true
            nodeTypes:
              - mgnl:redirect
            rules:
              notDeleted: *notDeleted
          groups:
            - name: editActions
              items:
                - name: editRedirect
                - name: deleteRedirect
            - name: publishingActions
              items:
                - name: publish
                - name: unpublish
        - name: folder
          availability:
            nodeTypes:
              - mgnl:folder
            rules:
              notDeleted: *notDeleted
          groups:
            - name: addActions
              items:
                - name: addRedirect
                - name: addFolder
            - name: editActions
              items:
                - name: deleteRedirect
            - name: publishingActions
              items:
                - name: publish
                - name: unpublish
        - name: root
          availability:
            root: true
            nodes: false
          groups:
            - name: addActions
              items:
                - name: addRedirect
                - name: addFolder
    workbench:
      contentViews:
        - name: tree
          $type: treeView
          columns:
            - name: jcrName
              $type: jcrTitleColumn
              propertyName: fromUrl
              nodeTypeToIcon:
                mgnl:redirect: icon-forward
                mgnl:folder: icon-folder-l
            - name: site
              class: info.magnolia.ui.contentapp.configuration.column.ConfiguredColumnDefinition
              width: 100
            - name: toUrl
              class: info.magnolia.ui.contentapp.configuration.column.ConfiguredColumnDefinition
              width: 300
            - name: mgnl:lastModified
              $type: dateColumn
              width: 160
            - name: jcrPublishingStatus
              $type: statusColumn
              label: Publication status

  detail:
    class: info.magnolia.ui.contentapp.detail.DetailDescriptor
    itemProvider:
      $type: jcrNodeFromLocationProvider
      workspace: redirects
      nodeType: mgnl:redirect
    datasource:
      <<: *datasource
      describeByProperty: fromUrl
    actions:
      commit:
        $type: commitAction
        implementationClass: work.noice.easyredirects.app.SaveRedirectAction
      cancel:
        $type: closeAction
    form:
      # New UI Forms bypass custom Java commit actions; retain the supported
      # Vaadin editor for this app so naming and normal save validation execute.
      $type: vaadinForm
      properties:
        - name: fromUrl
          $type: textField
          label: From URL
          required: true
          description: The URL path to redirect from (must start with /)
        - name: site
          $type: textField
          label: Site
          defaultValue: fallback
          required: true
          description: Site name (use 'fallback' for all sites)
        - name: toUrl
          $type: textField
          label: To URL
          required: true
          description: The destination URL
        - name: toUrlSuffix
          $type: textField
          label: URL Suffix
        - name: redirectType
          $type: radioButtonGroupField
          label: Redirect Type
          defaultValue: "301"
          datasource:
            $type: optionListDatasource
            options:
              - name: "301"
                value: "301"
                label: 301 Permanent
              - name: "302"
                value: "302"
                label: 302 Temporary
        - name: usePattern
          $type: checkBoxField
          label: Use Pattern
          description: Enable pattern matching for dynamic redirects
          defaultValue: false
        - name: description
          $type: textField
          label: Description
          rows: 3

permissions:
  roles:
    canAccessRedirectsApp: canAccessRedirectsApp
